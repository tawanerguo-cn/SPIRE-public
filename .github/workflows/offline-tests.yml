name: offline-tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-wheel-smoke:
    name: Base wheel and offline setup (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Install base dependencies into a clean environment
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\spire-base"
          & "$env:RUNNER_TEMP\spire-base\Scripts\python.exe" -m pip install (Get-ChildItem wheelhouse\spire_spm-*.whl | Select-Object -ExpandProperty FullName)
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed with exit $LASTEXITCODE." }
      - name: Exercise the installed package outside the checkout
        shell: pwsh
        run: |
          $scripts = "$env:RUNNER_TEMP\spire-base\Scripts"
          $spire = "$scripts\spire.exe"
          $agent = "$scripts\spire-agent.exe"
          $recorder = "$scripts\spire-recorder.exe"
          $work = Join-Path $env:RUNNER_TEMP 'spire-smoke'
          function Invoke-Smoke([string]$Executable, [string[]]$Arguments) {
            & $Executable @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed (exit $LASTEXITCODE): $Executable $($Arguments -join ' ')"
            }
          }
          New-Item -ItemType Directory -Path $work | Out-Null
          Push-Location $work
          try {
            Invoke-Smoke $spire @('doctor', '--json')
            Invoke-Smoke $spire @('init', '--directory', "$work\.local\site")
            Invoke-Smoke $spire @('doctor', '--site', "$work\.local\site", '--json')
            Invoke-Smoke $recorder @('--config', "$work\.local\site\recording.toml", 'status')
            $env:NANONIS_BACKEND = 'live'
            Invoke-Smoke $spire @('demo', '--output', "$work\demo")
            Remove-Item Env:NANONIS_BACKEND
            Invoke-Smoke $agent @('--help')
            Invoke-Smoke $recorder @('--help')
          } finally {
            Remove-Item Env:NANONIS_BACKEND -ErrorAction SilentlyContinue
            Pop-Location
          }
  windows-offline:
    name: Windows offline (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RUN_LIVE_NANONIS: '0'
      NANONIS_BACKEND: fake
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline test dependencies
        run: python -m pip install -e ".[agent,api,validation,live]"
      - name: Run full offline suite
        run: python -B -m unittest discover -s tests -v
