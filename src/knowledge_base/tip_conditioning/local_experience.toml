implementation_reference = "docs/operations/authorized-control.md"
observation_reference = "private_source_not_included_in_release"
candidate_evidence = "not_included_in_public_release"
candidate_retention_reference = "workflow.md#从当前结果决定下一步"

[scan_tracking]
source_date = "2026-10-06"
source_kind = "operator_instruction"
scope = "本站STM扫描；按当前跟踪表现调速。"
guide = "workflow.md#扫描速度怎么调"
decision_reference = "workflow.md#从当前结果决定下一步"
