[exit_policy]
status = "reviewed_intent; quality_stagnation_rule_uncalibrated"
guide = "workflow.md"
protective_exit = "实际失控与预期瞬态、软件错误、质量不足分开；不让严重异常接触等待报告。"
burst_end = "watchdog结束不证明针不可修复，也不是独立退针依据。"
quality_stagnation_rule = "看不同干净位置的响应和恢复后效果；几百次pulse本身不构成停止、升级或人工接管理由。"
handoff = "操作员接管后停止agent控制；旧授权不能用于退针或自动收尾，并发观察不得携带控制动作。"

[post_approach_verification]
requirement = "真实接触、电流/Z和工作点独立确认后再选框/扫描，不靠返回完成或feedback ON。"
scan_geometry = "按新区域实际接触位置选择框与起扫路径，不自动套旧框。"
source = "Historical site reference; source data are not included in this release."

