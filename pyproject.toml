[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-spm"
version = "0.0.101"
description = "SPiRE: Scanning Probe intelligence for Research Experimentation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6,<3"]

[project.scripts]
spire = "runtime_layer.onboarding:main"
spire-agent = "runtime_layer.agent_cli:main"
spire-recorder = "runtime_layer.recorder_cli:main"

[project.optional-dependencies]
live = ["nanonis-spm>=1.0.9"]
validation = ["matplotlib"]
agent = ["mcp>=2.1.1,<3", "matplotlib>=3.8"]
api = ["openai>=2.54,<3", "matplotlib>=3.8"]
research = ["pymupdf>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_base = [
    "gui_action_bindings/*.toml",
    "instrument_profiles/*.toml",
    "instrument_profiles/*.md",
    "recording_patterns/*.toml",
    "tip_quality_references/*.toml",
    "tip_quality_references/*.md",
    "tip_conditioning/*.toml",
    "tip_conditioning/*.md",
    "script_manifests/*.toml",
    "literature/*.md",
    "literature/*/*.toml",
    "literature/*/*.md",
]
